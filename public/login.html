<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Student Task Dashboard Pro</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--bg-dominant);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: 2.5rem;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    .auth-card header {
      border: none;
      padding: 0;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .auth-card h2 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }
    .auth-card p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .auth-form label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--text-primary);
    }
    .auth-form input {
      width: 100%;
      padding: 12px;
      background: var(--bg-dominant);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-primary);
      outline: none;
      margin-bottom: 1.2rem;
    }
    .auth-form input:focus {
      border-color: var(--accent-primary);
    }
    .auth-form button {
      width: 100%;
      padding: 12px;
      background: var(--accent-primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .auth-form button:hover {
      background: var(--accent-primary-hover);
    }
    .auth-error {
      background: rgba(239, 68, 68, 0.1);
      color: var(--status-urgent);
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      text-align: center;
      font-size: 0.9rem;
      display: none;
    }
    .auth-footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    .auth-footer a {
      color: var(--accent-primary);
      font-weight: 600;
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <header>
        <h2>Welcome Back 👋</h2>
        <p>Sign in to access your study space</p>
      </header>

      <div id="authError" class="auth-error"></div>

      <form id="loginForm" class="auth-form">
        <label>Email / Username</label>
        <input type="text" id="loginIdentifier" placeholder="student@school.edu" required>
        
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
        
        <button type="submit">Sign In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create Account</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('loginIdentifier').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const errorDiv = document.getElementById('authError');
      
      errorDiv.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });

        const data = await res.json();
        if (res.ok) {
          const user = data.user;
          localStorage.setItem('user', JSON.stringify(user));
          window.location.href = 'dashboard.html';
        } else {
          errorDiv.textContent = data.message || 'Invalid login credentials.';
          errorDiv.style.display = 'block';
        }
      } catch (error) {
        errorDiv.textContent = 'Connection error. Please try again.';
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
